<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên mật khẩu - Video Admin</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <img src="assets/img/logo.svg" alt="Video Admin Logo" class="auth-logo">
        <h1 class="auth-title" id="page-title">Quên mật khẩu</h1>
        <p class="auth-desc" id="page-desc">Khôi phục quyền truy cập vào tài khoản</p>
      </div>

      <div id="alert-box" style="display: none;"></div>

      <!-- Bước 1: Nhập email gửi link -->
      <div id="step-request">
        <form id="request-form" class="auth-form" novalidate>
          <div class="form-group">
            <label for="email" class="form-label form-label--required">Email của tài khoản</label>
            <input type="email" id="email" class="form-input" placeholder="admin1@gmail.com" required>
            <div id="email-error" class="form-error"></div>
          </div>

          <button type="submit" id="btn-request" class="btn btn--primary w-100" style="height: 42px;">
            Gửi liên kết đặt lại mật khẩu
          </button>
        </form>

        <!-- Hộp Email Giả lập hiển thị sau khi gửi -->
        <div id="simulated-email-box" class="auth-reset-box" style="display: none;">
          <div class="font-semibold text-primary" style="display: flex; align-items: center; gap: 6px; margin-bottom: 8px;">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
            Hộp thư giả lập (Demo Mode)
          </div>
          <p class="text-secondary" style="font-size: 13px; margin-bottom: 12px;">
            Hệ thống đã tạo liên kết đặt lại mật khẩu (có hiệu lực trong 15 phút):
          </p>
          <div style="margin-bottom: 12px;">
            <a id="reset-link-btn" href="#" class="btn btn--primary btn--sm" style="width: 100%;">
              Đặt lại mật khẩu tại đây &rarr;
            </a>
          </div>
          <p class="text-muted" style="font-size: 11px; margin-bottom: 0;">
            * Trong môi trường thực tế, liên kết này sẽ được gửi đến hòm thư người dùng.
          </p>
        </div>
      </div>

      <!-- Bước 2: Đặt mật khẩu mới khi có token -->
      <div id="step-reset" style="display: none;">
        <form id="reset-form" class="auth-form" novalidate>
          <div class="form-group">
            <label for="new-password" class="form-label form-label--required">Mật khẩu mới</label>
            <input type="password" id="new-password" class="form-input" placeholder="Tối thiểu 6 ký tự" required autocomplete="new-password">
            <div id="new-password-error" class="form-error"></div>
          </div>

          <div class="form-group">
            <label for="confirm-new-password" class="form-label form-label--required">Nhập lại mật khẩu mới</label>
            <input type="password" id="confirm-new-password" class="form-input" placeholder="Nhập lại chính xác mật khẩu" required autocomplete="new-password">
            <div id="confirm-new-password-error" class="form-error"></div>
          </div>

          <button type="submit" id="btn-save-password" class="btn btn--primary w-100" style="height: 42px;">
            Lưu mật khẩu mới
          </button>
        </form>
      </div>

      <div class="auth-footer">
        <a href="login.html">&larr; Quay lại Đăng nhập</a>
      </div>
    </div>
  </div>

  <div id="toast-root" class="toast-container"></div>

  <script type="module" src="js/pages/forgot-password.js"></script>
</body>
</html>
