<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký tài khoản - Video Admin</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <img src="assets/img/logo.svg" alt="Video Admin Logo" class="auth-logo">
        <h1 class="auth-title">Đăng ký tài khoản</h1>
        <p class="auth-desc">Tạo tài khoản để trải nghiệm Video Admin</p>
      </div>

      <div id="alert-box" style="display: none;"></div>

      <form id="register-form" class="auth-form" novalidate>
        <div class="form-group">
          <label for="username" class="form-label form-label--required">Tên đăng nhập</label>
          <input type="text" id="username" class="form-input" placeholder="vd: nguyen_van_a" required autocomplete="username">
          <div id="username-error" class="form-error"></div>
        </div>

        <div class="form-group">
          <label for="email" class="form-label form-label--required">Địa chỉ Email</label>
          <input type="email" id="email" class="form-input" placeholder="vd: a@gmail.com" required autocomplete="email">
          <div id="email-error" class="form-error"></div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label form-label--required">Mật khẩu</label>
          <input type="password" id="password" class="form-input" placeholder="Tối thiểu 6 ký tự" required autocomplete="new-password">
          <div id="password-error" class="form-error"></div>
        </div>

        <div class="form-group">
          <label for="confirm-password" class="form-label form-label--required">Nhập lại mật khẩu</label>
          <input type="password" id="confirm-password" class="form-input" placeholder="Nhập lại chính xác mật khẩu" required autocomplete="new-password">
          <div id="confirm-password-error" class="form-error"></div>
        </div>

        <div class="form-group" style="margin-bottom: 20px;">
          <label class="form-check">
            <input type="checkbox" id="terms-agree" checked>
            <span style="font-size: 13px; color: var(--text-secondary);">Tôi đồng ý với các điều khoản sử dụng</span>
          </label>
          <div id="terms-error" class="form-error"></div>
        </div>

        <button type="submit" id="btn-submit" class="btn btn--primary w-100" style="height: 42px;">
          Tạo tài khoản
        </button>
      </form>

      <div class="auth-footer">
        Đã có tài khoản? <a href="login.html">Đăng nhập ngay</a>
      </div>
    </div>
  </div>

  <div id="toast-root" class="toast-container"></div>

  <script type="module" src="js/pages/register.js"></script>
</body>
</html>
